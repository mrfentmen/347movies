name: Weekly license-gate re-probe

on:
  schedule:
    # Wednesdays 12:00 UTC — offset from the Monday new-arrivals run: checks whether any
    # registered pool gained licensed items, or a candidate collection newly cleared the
    # license gate (the only honest way the catalog can grow).
    - cron: "0 12 * * 3"
  workflow_dispatch:
    # Manual runs default to the real sweep. force-change=true simulates a change so the
    # issue-creation step fires on a quiet week — the end-to-end positive-path test
    # (proves the exact `gh issue create` command opens an issue; close it afterwards).
    inputs:
      force-change:
        description: "Simulate a change so the issue step fires (test only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # opens the sweep report issue when pool growth / a new collection appeared

jobs:
  license-sweep:
    name: Re-probe pools and candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve the force-change test knob
        id: force
        env:
          INPUT: ${{ inputs.force-change }}
        run: |
          # Dispatch booleans arrive as strings; the env var keeps the comparison out of the
          # sweep command line (an Actions expression inline there proved unreliable).
          if [ "$INPUT" = "true" ]; then echo "SWEEP_FORCE_CHANGE=1" >> "$GITHUB_ENV"; fi
      - name: Re-probe the license gate
        id: sweep
        run: |
          # One script, two artifacts: JSON for the gate, markdown for the issue. The script
          # exits 0 either way (a quiet week is a valid result); the issue only opens when
          # something actually changed (or SWEEP_FORCE_CHANGE=1 is set for the dispatch test).
          node scripts/license-sweep.ts --json --baseline-from=2026-08-22 --body-out=/tmp/license-sweep.md > /tmp/license-sweep.json
          ANY=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/license-sweep.json','utf8')).anyChange")
          echo "anyChange=$ANY" >> "$GITHUB_OUTPUT"
          echo "Re-probe complete (anyChange=$ANY)."
      - name: Aggregation-based collection probe
        id: aggregation
        run: |
          # The reverse of the name-guessing sweep: sample the licensed population by
          # downloads and aggregate their real collection fields, surfacing collections
          # no prior sweep named (documented in docs/institutional-collections-research.md).
          # Exits 0 either way; a quiet week reports "No new collections found."
          node scripts/aggregation-probe.ts --json --body-out=/tmp/aggregation-probe.md > /tmp/aggregation-probe.json
          ANY=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/aggregation-probe.json','utf8')).anyChange")
          echo "anyChange=$ANY" >> "$GITHUB_OUTPUT"
          echo "Aggregation probe complete (anyChange=$ANY)."
      - name: Open the sweep report issue
        if: steps.sweep.outputs.anyChange == 'true' || steps.aggregation.outputs.anyChange == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          { cat /tmp/license-sweep.md; echo; echo; cat /tmp/aggregation-probe.md; } > /tmp/sweep-report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "License-gate sweep — week of $WEEK" \
            --body "$(cat /tmp/sweep-report.md)"
