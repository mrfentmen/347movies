name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets-scan:
    name: Secret scan (whole tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan for token-shaped strings
        run: |
          # Whole-tree guard: the 2026-08-16 incident put a live Cloudflare deploy
          # token in tests/, outside the deploy scan's roots (public/functions/lib/
          # wrangler.jsonc). The single implementation (scripts/check-secrets.ts) is
          # shared end-to-end — the pre-commit hook, npm test, and this job all run
          # the same scan over git-tracked files, so the pattern can never drift
          # between CI and the hook. The synthetic scanner fixtures in
          # tests/deploy.test.ts are excluded inside the script. In CI the checkout
          # is clean, so git-tracked == the whole tree (the old inline grep found
          # nothing the script misses here).
          if ! node scripts/check-secrets.ts; then
            echo "::error::token-shaped string found in the tree (see script output above)"
            exit 1
          fi

  smoke:
    name: Live smoke (local dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot wrangler dev and run the live smoke suite
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          # The smoke suite is the project's live health check (182+ real network
          # requests against the served site). Run it against a local wrangler dev
          # server so a PR is tested on its own code, not the deployed site.
          # SMOKE_MIN_SITEMAP_URLS is relaxed vs the canonical floor (18000) purely
          # for CI speed — the full catalog build still runs; only the assertion
          # floor is lower.
          # RATE_LIMIT is raised for the smoke run: the suite intentionally issues well
          # over 60 rate-limited requests per run, so the dev server's production default
          # would 429 it mid-run (production keeps the default).
          npx wrangler pages dev public --port 8788 --binding RATE_LIMIT=10000 > /tmp/wrangler-dev.log 2>&1 &
          SERVER_PID=$!
          HEALTHY=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8788/api/health > /dev/null 2>&1; then
              HEALTHY=1
              echo "dev server healthy after ~$((i * 2))s"
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::wrangler dev did not become healthy — log tail:"
            tail -40 /tmp/wrangler-dev.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          SMOKE_BASE_URL=http://127.0.0.1:8788 SMOKE_MIN_SITEMAP_URLS=500 npm run smoke
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

  gate-scripts:
    name: Gate scripts execute (scan-longtail + license-sweep + aggregation-probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the three gate-building scripts against the real archive.org API
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          # The three scripts that build archive.org gate queries themselves (every other
          # query flows through lib/archive.ts and is covered by the unit suite). A syntax
          # error, a broken .ts import, or a gate change that stops resolving must fail
          # here — before merge, not on the first Wednesday cron. All three hit the real API:
          # scan-longtail fetches the legal catalog (limit 1) and checks one identifier;
          # license-sweep probes all pools + candidates via LEGAL_CLAUSE; aggregation-probe
          # samples the licensed population and aggregates collection fields (limit 500 for
          # CI speed — the weekly run uses the full 10,000).
          set -o pipefail
          SCAN=$(node scripts/scan-longtail.mjs --limit 1 --out /tmp/scan-longtail.jsonl --timeout 8 2>&1)
          SCAN_STATUS=$?
          echo "$SCAN"
          SWEEP=$(node scripts/license-sweep.ts --json 2>&1)
          SWEEP_STATUS=$?
          # stdout only: the probe logs per-page fetch warnings to stderr (graceful
          # degradation), so 2>&1 here would corrupt the JSON the structural check parses.
          # limit=100 keeps the PR-CI sample fast; the weekly run uses the full 10,000.
          AGG=$(node scripts/aggregation-probe.ts --limit=100 --json)
          AGG_STATUS=$?
          AGGA=$(node scripts/aggregation-probe.ts --mediatype=audio --limit=100 --json)
          AGGA_STATUS=$?
          AGGE=$(node scripts/aggregation-probe.ts --mediatype=etree --limit=100 --json)
          AGGE_STATUS=$?
          # Preview the sweep JSON (head is display-only; the structural check below parses
          # the full document, so a truncated preview can't fail the gate).
          echo "$SWEEP" | head -c 400
          echo
          # Assert all three executed against a real, populated catalog.
          echo "$SCAN" | grep -qE "catalog has [0-9]+ ids" || { echo "::error::scan-longtail did not report the catalog"; exit 1; }
          echo "$SCAN" | grep -qE "done: 1 checked" || { echo "::error::scan-longtail did not complete its check"; exit 1; }
          # Structural JSON check: the sweep must emit a pools array (18 registered pools),
          # an errors array, and the anyChange boolean — parsing the whole document, so a
          # JSON formatting change or a pools report that silently stopped probing fails here.
          echo "$SWEEP" | node -e '
            let d = ""; process.stdin.on("data", (c) => (d += c));
            process.stdin.on("end", () => {
              let j;
              try { j = JSON.parse(d); } catch { console.error("::error::license-sweep did not emit valid JSON"); process.exit(1); }
              if (!Array.isArray(j.pools) || j.pools.length < 18) { console.error("::error::license-sweep pools report is incomplete (" + (Array.isArray(j.pools) ? j.pools.length : "none") + " pools)"); process.exit(1); }
              if (!Array.isArray(j.errors)) { console.error("::error::license-sweep errors field missing"); process.exit(1); }
              if (typeof j.anyChange !== "boolean") { console.error("::error::license-sweep anyChange field missing"); process.exit(1); }
              console.log(`ok: license-sweep report parsed — ${j.pools.length} pools, ${j.errors.length} errors`);
            });
          '
          # Structural JSON check for each aggregation-probe mediatype: must emit a
          # newCollections array, a curatedViews array, and the anyChange boolean.
          check_probe() {
            echo "$1" | node -e '
              let d = ""; process.stdin.on("data", (c) => (d += c));
              process.stdin.on("end", () => {
                let j;
                try { j = JSON.parse(d); } catch { console.error("::error::aggregation-probe did not emit valid JSON"); process.exit(1); }
                if (!Array.isArray(j.newCollections)) { console.error("::error::aggregation-probe newCollections field missing"); process.exit(1); }
                if (!Array.isArray(j.curatedViews)) { console.error("::error::aggregation-probe curatedViews field missing"); process.exit(1); }
                if (typeof j.candidatesChecked !== "number") { console.error("::error::aggregation-probe candidatesChecked field missing"); process.exit(1); }
                if (typeof j.anyChange !== "boolean") { console.error("::error::aggregation-probe anyChange field missing"); process.exit(1); }
                console.log(`ok: aggregation-probe(${j.mediatype}) parsed — ${j.newCollections.length} new, ${j.curatedViews.length} curated, ${j.candidatesChecked} checked`);
              });
          '
          }
          check_probe "$AGG"
          check_probe "$AGGA"
          check_probe "$AGGE"
          [ "$SCAN_STATUS" -eq 0 ] || { echo "::error::scan-longtail exited $SCAN_STATUS"; exit 1; }
          [ "$SWEEP_STATUS" -eq 0 ] || { echo "::error::license-sweep exited $SWEEP_STATUS"; exit 1; }
          [ "$AGG_STATUS" -eq 0 ] || { echo "::error::aggregation-probe (movies) exited $AGG_STATUS"; exit 1; }
          [ "$AGGA_STATUS" -eq 0 ] || { echo "::error::aggregation-probe (audio) exited $AGGA_STATUS"; exit 1; }
          [ "$AGGE_STATUS" -eq 0 ] || { echo "::error::aggregation-probe (etree) exited $AGGE_STATUS"; exit 1; }
          echo "ok: all three gate scripts executed against archive.org (movies + audio + etree)"

  browser-batteries:
    name: Browser battery (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: live
            script: live-surfaces
          - target: prototype
            script: prototype
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the prototype's own dependencies
        if: matrix.target == 'prototype'
        run: cd ui-prototype && npm ci
      - name: Install Playwright (python) + bundled chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run the ${{ matrix.target }} browser battery
        env:
          BATTERY_CI: "1"
        run: npm run test:${{ matrix.script }}

  browser:
    name: Browser battery (E2E / keyboard / mobile / axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install playwright
      # The axe audit uses system Chrome via channel="chrome"; ubuntu-latest ships it.
      - run: python -m playwright install --with-deps chromium
      - name: Boot wrangler dev and run the browser battery
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          # The UI/a11y battery (E2E flows, keyboard walk, mobile/zoom, axe-core) catches
          # regressions no unit test can: watchlist lifecycle, focus rings, reflow at
          # 375px/640px, WCAG violations. Scripts hardcode BASE=http://127.0.0.1:8787.
          npx wrangler pages dev public --port 8787 > /tmp/wrangler-browser.log 2>&1 &
          SERVER_PID=$!
          HEALTHY=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
              HEALTHY=1
              echo "dev server healthy after ~$((i * 2))s"
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::wrangler dev did not become healthy — log tail:"
            tail -40 /tmp/wrangler-browser.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          python scripts/e2e_test.py && \
          python scripts/e2e_keyboard.py && \
          python scripts/e2e_mobile.py && \
          python scripts/axe-audit.py
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
